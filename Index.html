<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonline Classes · Learn · Play · Shine</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root{
  --bg:#fbf7ff;--card:#ffffff;--ink:#241a40;--mut:#6b6490;--line:#efe4ff;
  --pri:#7c3aed;--pri2:#a855f7;--rose:#e11d48;--amber:#f59e0b;--green:#10b981;--blue:#0ea5e9;
  --rain:linear-gradient(90deg,#f43f5e,#fb923c,#facc15,#22c55e,#0ea5e9,#8b5cf6,#ec4899);
  --shadow:0 12px 34px rgba(80,30,150,.12);--r:18px;
}
body{
  margin:0;color:var(--ink);min-height:100vh;overflow-x:hidden;
  font:400 16px/1.6 Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;
  background:
    radial-gradient(900px 520px at 0% -8%,#ffe6f2 0,transparent 55%),
    radial-gradient(900px 520px at 100% 0%,#e3f2ff 0,transparent 55%),
    radial-gradient(800px 620px at 50% 112%,#eaffef 0,transparent 60%),
    var(--bg);
}
h1,h2,h3,h4,b,strong,.logo,.brand-name,.tab,.btn,button{font-family:'Baloo 2',system-ui,sans-serif}
h1,h2,h3{margin:.2em 0 .45em;line-height:1.2}
p{margin:.4em 0}
a{cursor:pointer;color:var(--pri);text-decoration:none}
img{max-width:100%}
.mut{color:var(--mut)}
.small{font-size:.82rem}
.center{text-align:center}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 16px;color:#fff;background:linear-gradient(100deg,#3b0764,#6d28d9 45%,#c026d3 82%,#db2777);
  box-shadow:0 6px 24px rgba(76,29,149,.28);border-bottom:4px solid var(--amber)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font:800 26px 'Baloo 2';color:#fff;background:var(--rain);border:2px solid rgba(255,255,255,.35);
  box-shadow:0 4px 14px rgba(0,0,0,.25);flex:none}
.brand-name{font:800 1.18rem/1.1 'Baloo 2';letter-spacing:.3px}
.brand-name small{display:block;font:400 .66rem/1.35 Nunito;opacity:.85;letter-spacing:.4px}
.navlinks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nav{color:#fff;padding:7px 14px;border-radius:40px;font-weight:700;font-size:.92rem;transition:.2s}
.nav:hover,.nav.on{background:rgba(255,255,255,.2)}
.nav.gold{background:var(--amber);color:#3b2200}
.nav.gold:hover{background:#fbbf24}
.nav.ghost{background:rgba(255,255,255,.16)}
.nav.out{background:#e11d48}
.nav.out:hover{background:#be123c}

main{max-width:1080px;margin:0 auto;padding:14px 14px 44px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 16px 30px;text-align:center;color:#fff;
  background:linear-gradient(135deg,#4c1d95,#7c3aed 45%,#db2777);box-shadow:var(--shadow);
  border-bottom:8px solid var(--amber);margin-bottom:6px;perspective:800px}
.hero h1{font-size:clamp(24px,6vw,40px);margin:6px 0 8px;text-shadow:0 3px 0 rgba(0,0,0,.22)}
.hero-sub{max-width:660px;margin:0 auto 16px;opacity:.96;font-size:1.02rem;position:relative;z-index:2}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;z-index:2}
.word{display:flex;justify-content:center;flex-wrap:wrap;gap:1px;position:relative;z-index:2;padding-top:6px}
.logo{display:inline-block;font:800 clamp(34px,10vw,78px)/1 'Baloo 2';cursor:pointer;user-select:none;
  text-shadow:0 5px 0 rgba(0,0,0,.22);animation:drop .95s cubic-bezier(.3,1.6,.5,1) both;
  animation-delay:calc(var(--i) * .09s);transform-style:preserve-3d}
.logo.b{animation:bounce .7s}
@keyframes drop{0%{transform:translateY(-360px) rotate(-35deg) rotateX(40deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes bounce{0%,100%{transform:none}40%{transform:translateY(-26px) rotate(8deg) rotateY(25deg) scale(1.18)}}
.blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.35;pointer-events:none}
.blob.b1{width:180px;height:180px;background:#facc15;top:-60px;left:-40px}
.blob.b2{width:170px;height:170px;background:#22d3ee;bottom:-80px;right:-40px}
.blob.b3{width:120px;height:120px;background:#f472b6;top:32%;right:9%}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;
  border-radius:40px;padding:10px 18px;font:700 1rem 'Baloo 2';color:#fff;text-decoration:none;
  background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 6px 16px rgba(124,58,237,.3);
  transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(124,58,237,.36)}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#3b2200;box-shadow:0 6px 16px rgba(245,158,11,.35)}
.btn.ok{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 16px rgba(16,185,129,.32)}
.btn.r{background:linear-gradient(135deg,#e11d48,#f43f5e);box-shadow:0 6px 16px rgba(225,29,72,.3)}
.btn.o{background:#fff;color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.full{width:100%}

/* ---------- cards / layout ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;
  box-shadow:var(--shadow);border-top:5px solid var(--line);transition:transform .18s,box-shadow .18s}
.card h3{margin-top:0}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-4px) rotateX(1deg);box-shadow:0 18px 40px rgba(80,30,150,.16)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.stat{text-align:center}
.stat .num{font:800 2rem/1.1 'Baloo 2';color:var(--pri);margin:4px 0}
.stat .lbl{font-weight:800;font-size:.9rem}
.stat .sub{font-size:.78rem;color:var(--mut);min-height:1.1em}
.sec{font-size:1.5rem;margin:26px 0 2px}
.note{background:#fff8e6;border:1px solid #fde68a;border-left:5px solid var(--amber);
  padding:12px 14px;border-radius:14px;margin:12px 0;line-height:1.55}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 0;border-bottom:1px dashed var(--line)}
.rowline:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid #e9d5ff;background:#faf5ff;
  border-radius:40px;padding:4px 12px;font-weight:700;font-size:.85rem}
.chip small{font-weight:400;color:var(--mut)}
.badge{display:inline-block;border-radius:40px;padding:2px 12px;font:700 .78rem Nunito;
  background:#f3e8ff;color:#6b21a8}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.bad{background:#ffe4e6;color:#9f1239}
.badge.big{background:#fde68a;color:#713f12;font-size:.95rem;padding:6px 16px}

/* ---------- forms ---------- */
.fg{margin:10px 0}
.fg label{display:block;font-weight:800;font-size:.9rem;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;
  border:2px solid var(--line);border-radius:14px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);
  box-shadow:0 0 0 4px rgba(124,58,237,.14)}
textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.5}
input[type=file]{padding:8px;border-radius:14px}
.fgrid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;
  padding:10px 12px;margin:8px 0;cursor:pointer;transition:.15s}
.opt:hover{border-color:#c4b5fd}
.opt:has(input:checked){border-color:var(--pri);background:#f7f2ff}
.opt input{width:auto;margin-top:4px;accent-color:var(--pri)}
.qbox{background:#fbf8ff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.panel{max-width:470px;margin:22px auto;background:#fff;border-radius:22px;padding:26px 22px;
  box-shadow:0 22px 60px rgba(80,30,150,.16);border-top:6px solid var(--pri)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border-radius:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
table.tbl th{background:#f6f0ff;color:#4c1d95;text-align:left;padding:9px;
  font-size:.78rem;text-transform:uppercase;letter-spacing:.4px}
table.tbl td{padding:9px;border-bottom:1px solid #f3ecff;vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}

/* ---------- tabs / banner ---------- */
.banner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  border-radius:var(--r);padding:18px 20px;color:#fff;margin:6px 0 4px;
  background:linear-gradient(120deg,#4c1d95,#7c3aed 50%,#c026d3);box-shadow:var(--shadow)}
.banner h2{margin:0;font-size:1.5rem}
.banner p{margin:2px 0 0;opacity:.92;font-size:.9rem}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:thin}
.tab{border:0;cursor:pointer;white-space:nowrap;border-radius:40px;padding:9px 15px;
  font:700 .9rem 'Baloo 2';background:#fff;color:var(--pri);
  box-shadow:0 4px 14px rgba(80,30,150,.1);transition:.18s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff}

/* ---------- live ---------- */
.live-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;padding:13px 18px;
  border-radius:18px;color:#fff;background:linear-gradient(120deg,#e11d48,#f97316);
  box-shadow:0 10px 26px rgba(225,29,72,.32);animation:pulse 1.9s infinite}
.live-banner .dot{width:12px;height:12px;border-radius:50%;background:#fff;animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 13px rgba(255,255,255,0)}}
@keyframes pulse{50%{transform:scale(1.008)}}
.live-card{background:linear-gradient(135deg,#fff1f2,#fff7ed);border-top:5px solid var(--rose)}

/* ---------- calendar ---------- */
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}
.cal .ch{font-weight:800;color:var(--mut);font-size:.78rem;padding:4px 0}
.cal .cd{padding:9px 0;border-radius:12px;cursor:pointer;border:2px solid transparent;
  font-weight:700;font-size:.9rem;transition:.15s}
.cal .cd:hover{background:#f6f0ff;transform:scale(1.06)}
.cal .cd.has{background:linear-gradient(135deg,#ede9fe,#fce7f3);color:#6b21a8}
.cal .cd.sel{border-color:var(--pri);background:#fff;color:var(--pri)}
.legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mut);margin-top:10px}
.legend i{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,#ede9fe,#fce7f3);display:inline-block}

/* ---------- misc ---------- */
.frame{width:100%;height:70vh;border:2px solid var(--line);border-radius:16px;background:#fff}
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.photo{width:112px;height:132px;border-radius:16px;background:#f6f0ff;border:3px solid var(--amber);
  display:flex;align-items:center;justify-content:center;font-size:2.6rem;overflow:hidden;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.pgrid div{border-bottom:1px solid #f3ecff;padding-bottom:6px}
.pgrid span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:300;
  display:flex;gap:10px;align-items:center;padding:12px 20px;border-radius:40px;
  background:#241a40;color:#fff;font-weight:700;box-shadow:0 16px 44px rgba(0,0,0,.32);
  border-left:6px solid var(--amber);max-width:92vw}
.toast.hidden{display:none}
.back{position:fixed;inset:0;background:rgba(36,26,64,.58);z-index:200;display:flex;
  justify-content:center;align-items:flex-start;padding:4vh 12px;overflow:auto}
.modal{background:#fff;border-radius:20px;max-width:720px;width:100%;padding:20px;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.4);transform:perspective(900px) rotateX(2deg)}
.modal .x{position:absolute;top:10px;right:12px;border:0;background:#f6f0ff;color:var(--pri);
  border-radius:50%;width:34px;height:34px;font-size:1.05rem;cursor:pointer;font-weight:800}
footer{background:linear-gradient(100deg,#3b0764,#6d28d9);color:#fff;text-align:center;
  padding:20px 16px;border-top:4px solid var(--amber);font-size:.9rem}
footer .f2{color:#c4b5fd;font-size:.8rem;margin-top:4px}

/* birthday celebration */
.birthday-card{background:linear-gradient(135deg,#fef3c7,#fde68a,#fca5a5);border:2px dashed var(--rose);
  animation:birthdayGlow 2s ease-in-out infinite alternate}
@keyframes birthdayGlow{from{box-shadow:0 0 0 rgba(225,29,72,.2)}to{box-shadow:0 0 30px rgba(225,29,72,.6)}}
.birthday-card h3{color:#9f1239}

@media(max-width:640px){
  .topbar{padding:8px 12px}
  .brand-name{font-size:1rem}
  .brand-logo{width:40px;height:40px;font-size:22px}
  main{padding:10px 10px 40px}
  .hero{border-radius:20px;padding:18px 12px 26px}
  .btn{padding:9px 15px;font-size:.95rem}
  .card{padding:14px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" data-page="home">
    <span class="brand-logo">S</span>
    <span class="brand-name">Sonline Classes<small>samson online classes · learn · play · shine</small></span>
  </div>
  <nav class="navlinks" id="nav"></nav>
</header>

<main id="app"></main>

<footer>
  <div id="foot"></div>
  <div class="f2">Learn · Play · Shine — 100% online, Grade 1 to Grade 12</div>
</footer>

<div id="toast" class="toast hidden"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   CONFIG & CONSTANTS
   ========================================================================= */
const COL=['#f43f5e','#fb923c','#facc15','#22c55e','#0ea5e9','#8b5cf6','#ec4899'];
const WORD='SONLINE';
const CLASSES=Array.from({length:12},(_,i)=>'Grade '+(i+1));
const SUBJECTS=['Mathematics','English Language','Basic Science','Physics','Chemistry','Biology',
  'Economics','Government','Literature','Computer Science','Civic Education','Geography',
  'Further Mathematics','French','Creative Arts'];
const MAX_MB=20;

const DEF={
  links:[
    {n:'Zoom Class 1',u:'https://us05web.zoom.us/j/4376132456?pwd=w9eNP5rtietTKIjwRnrDjBqyW8uYyX.1'},
    {n:'Zoom Class 2',u:'https://us05web.zoom.us/j/6363046070?pwd=8zIHQdXFNsde7CnOZLurQBeYWAyA2E.1'},
    {n:'Google Meet (code: pef-nopp-fmz)',u:'https://meet.google.com/pef-nopp-fmz'}
  ],
  email:'sonlineclasses01@gmail.com',
  phones:['+2347037607137','+2348059790392'],
  teacherCode:'SONLINE-TEACH',
  adminCode:'SONLINE-ADMIN',
  mainAdminEmail:'sonlineclasses01@gmail.com',
  whatsapp:'2347037607137',                       // WhatsApp line used by wa.me (country code, no + or spaces)
  formEndpoint:'https://formspree.io/f/mzeepooo', // Formspree: delivers every contact message to your email
  supabaseUrl:'https://pvqpvjrpkreeywkfjwqh.supabase.co',                                 // e.g. https://abcdxyz.supabase.co  (paste yours here or in Admin > Settings)
  supabaseKey:'sb_publishable_Fn0pooITxYXR5gagWnOsuQ_QCQHtI7w'                                  // Supabase "anon public" key
};

/* =========================================================================
   STORAGE
   ========================================================================= */
function LSget(k,d){try{const v=JSON.parse(localStorage.getItem('son_'+k));return v==null?(d===undefined?[]:d):v}catch(e){return d===undefined?[]:d}}
function LSset(k,v){try{localStorage.setItem('son_'+k,JSON.stringify(v))}catch(e){}}

let cfg=Object.assign({},DEF,LSget('settings',{}));
// persist config changes
function saveCfg(){LSset('settings',cfg)}
['formEndpoint','whatsapp'].forEach(k=>{if(!cfg[k])cfg[k]=DEF[k]});
// Supabase URL and key always come from the code above; saved settings can never override them
cfg.supabaseUrl=DEF.supabaseUrl;cfg.supabaseKey=DEF.supabaseKey;

/* Supabase (plain REST, no library needed). Only active once URL + key are filled in. */
const sbOn=()=>/^https:\/\/.+/.test(String(cfg.supabaseUrl||''))&&!!String(cfg.supabaseKey||'').trim();
async function sbInsert(table,row){
  if(!sbOn())return false;
  try{
    const r=await fetch(String(cfg.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/'+table,{
      method:'POST',
      headers:sbHeaders({'Prefer':'return=minimal'}),
      body:JSON.stringify(row)});
    return r.ok;
  }catch(e){return false}
}
const waNum=()=>String(cfg.whatsapp||(cfg.phones&&cfg.phones[0])||'').replace(/\D/g,'');

const users=()=>LSget('users'),        saveUsers=v=>LSset('users',v);
const subs=()=>DB.subs,                saveSubs=v=>sbSave('subs',v);
const events=()=>DB.events,            saveEvents=v=>sbSave('events',v);
const resources=()=>DB.resources,      saveResources=v=>sbSave('resources',v);

/* =========================================================================
   SUPABASE DATA: assignments, grades, news
   Each table has: id (text, primary key), data (jsonb), created_at (timestamptz).
   Data is fetched from Supabase and saved back with async REST calls.
   ========================================================================= */
const SBT=['assignments','grades','news','subs','events','resources','lessons','messages'];
const DB={assignments:[],grades:[],news:[],subs:[],events:[],resources:[],lessons:[],messages:[]};                          // in-memory copy loaded from Supabase
const SYN={assignments:new Map(),grades:new Map(),news:new Map(),subs:new Map(),events:new Map(),resources:new Map(),lessons:new Map(),messages:new Map()};    // id -> JSON last confirmed by Supabase
let sbLoaded=false,sbPending=0,sbQueue=Promise.resolve();
const sbHeaders=x=>{const h={'apikey':cfg.supabaseKey,'Content-Type':'application/json'};if(/^eyJ/.test(String(cfg.supabaseKey||'')))h.Authorization='Bearer '+cfg.supabaseKey;return Object.assign(h,x||{})};
const SBTABLE={assignments:'Assignment',grades:'Grades',news:'Announcement',subs:'Submissions',events:'Events',resources:'Resources',lessons:'Lessons',messages:'Messages'}; // your Supabase table names
const sbUrl=t=>String(cfg.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/'+(SBTABLE[t]||t);
const sbSort=(t,a)=>a.slice().sort((x,y)=>{const p=String(x.date||''),q=String(y.date||'');return t==='news'?(p<q?1:p>q?-1:0):(p<q?-1:p>q?1:0)});

async function sbFetch(table){
  const out=[];
  for(let off=0;;off+=1000){
    const r=await fetch(sbUrl(table)+'?select=rid,data&order=created_at.asc&limit=1000&offset='+off,{headers:sbHeaders()});
    if(!r.ok)throw new Error(table+' fetch failed: '+r.status);
    const rows=await r.json();
    rows.forEach(x=>{if(x&&x.data&&typeof x.data==='object')out.push(Object.assign({},x.data,{id:x.rid}))});
    if(rows.length<1000)break;
  }
  return out;
}
async function sbPut(table,rows){
  for(let i=0;i<rows.length;i+=50){
    const r=await fetch(sbUrl(table)+'?on_conflict=rid',{method:'POST',
      headers:sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify(rows.slice(i,i+50).map(x=>({rid:x.id,data:x})))});
    if(!r.ok)throw new Error(table+' save failed: '+r.status);
  }
}
async function sbDel(table,ids){
  for(let i=0;i<ids.length;i+=50){
    const r=await fetch(sbUrl(table)+'?rid=in.('+ids.slice(i,i+50).map(encodeURIComponent).join(',')+')',{method:'DELETE',headers:sbHeaders({'Prefer':'return=minimal'})});
    if(!r.ok)throw new Error(table+' delete failed: '+r.status);
  }
}
async function sbLoad(quiet){
  if(!sbOn())return false;
  try{
    const res=await Promise.all(SBT.map(sbFetch));
    SBT.forEach((t,i)=>{const rows=sbSort(t,res[i]);DB[t]=rows;SYN[t]=new Map(rows.map(x=>[x.id,JSON.stringify(x)]))});
    sbLoaded=true;return true;
  }catch(e){console.error(e);if(!quiet)toast('Could not load data from the database.',true);return false}
}
/* Saves the full list: only new/changed records are upserted and removed records are deleted. Resolves true/false. */
function sbSave(table,list){
  DB[table]=list;
  const snap=SYN[table];
  const now=new Map(list.map(x=>[x.id,JSON.stringify(x)]));
  const put=list.filter(x=>snap.get(x.id)!==now.get(x.id));
  const del=Array.from(snap.keys()).filter(id=>!now.has(id));
  if(!put.length&&!del.length)return Promise.resolve(true);
  const rollback=()=>{DB[table]=sbSort(table,Array.from(snap.values()).map(v=>JSON.parse(v)));render()};
  if(!sbOn()){toast('Database not connected. Add the Supabase URL and key in Admin > Settings.',true);rollback();return Promise.resolve(false)}
  sbPending++;
  const job=sbQueue.then(async()=>{
    try{
      if(put.length)await sbPut(table,put);
      if(del.length)await sbDel(table,del);
      put.forEach(x=>snap.set(x.id,now.get(x.id)));
      del.forEach(id=>snap.delete(id));
      return true;
    }catch(e){
      console.error(e);
      toast('Could not save to the database. Please check your connection and try again.',true);
      rollback();return false;
    }finally{sbPending--}
  });
  sbQueue=job.catch(()=>{});
  return job;
}

function isBirthdayToday(dob){
  if(!dob)return false;
  const d=new Date(dob),now=new Date();
  return d.getDate()===now.getDate()&&d.getMonth()===now.getMonth();
}
function birthdaySoon(dob,days=14){
  if(!dob)return false;
  const d=new Date(dob),now=new Date();
  const thisYear=new Date(now.getFullYear(),d.getMonth(),d.getDate());
  const diff=(thisYear-now)/86400000;
  if(diff>=0&&diff<=days)return true;
  if(diff<0){ // check next year
    const next=new Date(now.getFullYear()+1,d.getMonth(),d.getDate());
    return (next-now)/86400000<=days;
  }
  return false;
}

let _db;
function idb(){
  return _db||(_db=new Promise((res,rej)=>{
    if(!window.indexedDB){_db=null;return rej(new Error('IndexedDB unavailable'))}
    // open WITHOUT forcing a version so an existing newer database (version 2+) still works
    const open=v=>{
      const r=v?indexedDB.open('sonline_files',v):indexedDB.open('sonline_files');
      r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};
      r.onsuccess=()=>{
        const d=r.result;
        if(!d.objectStoreNames.contains('files')){const nv=d.version+1;d.close();open(nv);return}
        d.onversionchange=()=>{d.close();_db=null};
        res(d);
      };
      r.onerror=()=>{_db=null;rej(r.error)};
    };
    open();
  }));
}
async function putFile(file){
  const id=uid();const d=await idb();
  await new Promise((res,rej)=>{
    const t=d.transaction('files','readwrite');
    t.objectStore('files').put({id,name:file.name,type:file.type,blob:file});
    t.oncomplete=res;t.onerror=()=>rej(t.error);
  });
  return {id,name:file.name,type:file.type||'',size:file.size};
}
async function getFile(id){
  const d=await idb();
  return new Promise((res,rej)=>{
    const q=d.transaction('files').objectStore('files').get(id);
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
  });
}
async function delFiles(metas){
  try{
    const d=await idb();
    (metas||[]).forEach(m=>{d.transaction('files','readwrite').objectStore('files').delete(m.id)});
  }catch(e){}
}
async function saveFiles(fileList,imagesOnly){
  const out=[];
  for(const f of Array.from(fileList||[])){
    if(f.size>MAX_MB*1048576){toast(f.name+' is larger than '+MAX_MB+' MB.',true);return null}
    if(imagesOnly&&!f.type.startsWith('image/')){toast('Please choose an image file.',true);return null}
    try{out.push(await putFile(f))}catch(e){toast('Could not store file: '+e.message,true);return null}
  }
  return out;
}
const EXT_TYPES={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',
  webp:'image/webp',txt:'text/plain',html:'text/html',htm:'text/html',mp4:'video/mp4',mp3:'audio/mpeg'};
const guessType=(t,n)=>t||EXT_TYPES[((n||'').split('.').pop()||'').toLowerCase()]||'application/octet-stream';
const VIEWABLE=/^(application\/pdf|image\/(png|jpe?g|gif|webp|bmp)|text\/(plain|html)|audio\/|video\/)/;

async function openFile(id,type,name,forceDownload){
  type=guessType(type,name);
  if(/^text\/html/.test(type)&&!forceDownload){
    try{const rec=await getFile(id);if(!rec){toast('File not found on this device.',true);return}
      const t=await new Response(rec.blob).text();
      showModal(`<h3>${esc(name)}</h3><iframe class="frame" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${esc(t)}"></iframe>`)}
    catch(err){toast('Could not open file.',true)}
    return;
  }
  const viewable=VIEWABLE.test(type)&&!forceDownload;
  let w=null;
  if(viewable){
    w=window.open('','_blank');
    if(!w){toast('Pop-up blocked. Allow pop-ups for this page and try again.',true);return}
  }
  try{
    const rec=await getFile(id);
    if(!rec){if(w)w.close();toast('File not found on this device.',true);return}
    const url=URL.createObjectURL(new Blob([rec.blob],{type}));
    if(viewable){w.location.href=url}
    else{
      const a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      toast('Downloading '+name);
    }
    setTimeout(()=>URL.revokeObjectURL(url),180000);
  }catch(e){if(w)w.close();toast('Could not open file.',true)}
}

function calendarHTML(u){
  const staff=isStaff(u);
  const y=state.calD.getFullYear(),m=state.calD.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const sel=state.selD||todayKey();
  const evs=events();

  let cells='SMTWTFS'.split('').map(d=>`<div class="ch">${d}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=days;d++){
    const key=y+'-'+pad(m+1)+'-'+pad(d);
    const has=evs.some(e=>dayKey(new Date(e.start))===key);
    cells+=`<div class="cd ${has?'has':''} ${key===sel?'sel':''}" data-act="pickday" data-key="${key}">${d}</div>`;
  }

  const list=evs.filter(e=>dayKey(new Date(e.start))===sel).sort((a,b)=>a.start-b.start);

  return `
  <h2>📅 Class calendar</h2>
  <div class="card">
    <div class="calhead">
      <button class="btn sm o" data-act="prevmonth">‹</button>
      <b>${state.calD.toLocaleString('en-GB',{month:'long',year:'numeric'})}</b>
      <button class="btn sm o" data-act="nextmonth">›</button>
    </div>
    <div class="cal">${cells}</div>
    <div class="legend"><i></i> day with a scheduled lesson</div>
  </div>

  <div class="card">
    <h3>${fmtDate(sel+'T12:00:00')}</h3>
    ${list.map(e=>`<div class="rowline">
      <div><b>${esc(e.title)}</b>
        <div class="mut small">${fmtTime(e.start)} · ${e.mins} min · ${esc(e.cls||'All classes')}</div></div>
      <div>
        <a class="btn sm ok" href="${esc(e.link)}" target="_blank" rel="noopener">Join</a>
        ${staff?`<button class="btn sm r" data-act="del-event" data-id="${e.id}">✕</button>`:''}
      </div>
    </div>`).join('')||'<p class="mut">No lessons on this day.</p>'}
  </div>

  ${staff?`
  <div class="card">
    <h3>➕ Schedule a live lesson</h3>
    <div class="fgrid">
      <div class="fg"><label>Lesson title</label><input id="et" placeholder="e.g. Maths — Fractions"></div>
      <div class="fg"><label>Class</label><select id="ec">${opts(['All Classes'].concat(CLASSES))}</select></div>
      <div class="fg"><label>Date</label><input id="ed" type="date" value="${sel}"></div>
      <div class="fg"><label>Start time</label><input id="eh" type="time" value="16:00"></div>
      <div class="fg"><label>Duration (minutes)</label><input id="em" type="number" value="60" min="10" max="240"></div>
      <div class="fg"><label>Class link</label><select id="el">
        ${cfg.links.map(l=>`<option value="${esc(l.u)}">${esc(l.n)}</option>`).join('')}</select></div>
      <div class="fg"><label>Repeat</label><select id="er">
        <option value="0">Does not repeat</option>
        <option value="1">Daily</option>
        <option value="7">Weekly</option>
        <option value="30">Monthly</option></select></div>
      <div class="fg"><label>How many times</label><input id="en" type="number" value="1" min="1" max="400"></div>
    </div>
    <button class="btn" data-act="add-event">Add to calendar</button>
    <p class="mut small" style="margin-top:8px">Tip: 52 weekly lessons fills a whole year of classes in one click.</p>
  </div>`:''}`;
}

function addEv(){
  const t=($('#et')?.value||'').trim();
  if(!t)return toast('Give the lesson a title.',true);
  const dateVal=$('#ed')?.value||todayKey();
  const timeVal=$('#eh')?.value||'16:00';
  const base=new Date(dateVal+'T'+timeVal);
  if(isNaN(base))return toast('Pick a valid date and time.',true);
  const rep=Number($('#er')?.value||0);
  const count=Math.min(Math.max(Number($('#en')?.value||1),1),400);
  const mins=Number($('#em')?.value||60);
  const link=$('#el')?.value||cfg.links[0].u;
  const cls=$('#ec')?.value||'All Classes';
  const list=events();
  for(let i=0;i<count;i++){
    const d=new Date(base);
    if(rep===30)d.setMonth(base.getMonth()+i);
    else d.setDate(base.getDate()+i*rep);
    list.push({id:uid(),title:t,cls,start:d.getTime(),mins,link,by:me()?me().email:'',ts:Date.now()});
    if(!rep)break;
  }
  saveEvents(list);
  state.selD=dayKey(base);
  state.calD=new Date(base.getFullYear(),base.getMonth(),1);
  toast(count>1?count+' lessons added to the calendar.':'Lesson added to the calendar.');
  render();
}

  return `<h2>${category==='classwork'?'✍️ Classwork':'📝 Assignments'} · ${esc(s.cls)}</h2>`+list.map(a=>{
    const sub=subOf(a.id,s.email);
    const overdue=a.due<todayKey();
    const status=sub
      ?(sub.score!=null?`<span class="badge ok">Marked ${sub.score}/${a.marks}</span>`:`<span class="badge ok">Submitted ✓</span>`)
      :(overdue?`<span class="badge bad">Overdue</span>`:`<span class="badge warn">Pending</span>`);
    const kindLabel=a.kind==='cbt'?'CBT':a.kind==='theory'?'Theory':'HTML / File';
    const canSubmit=!ro&&(!sub||(sub.score==null&&a.kind!=='cbt'));

    let work='';
    if(canSubmit){
      if(a.kind==='cbt')work=cbtForm(a,s);
      else if(a.kind==='theory')work=theoryForm(a,s);
      else work=htmlForm(a,s);
    }

    const graded=sub&&sub.score!=null
      ?`<div class="note"><b>Result: ${sub.score}/${a.marks}</b>${sub.feedback?'<br>'+esc(sub.feedback):''}
        ${sub.responses?`<div style="margin-top:6px">${sub.responses.map((r,i)=>
          `<div>Q${i+1}: <b>${r.correct?'✔ Correct':'✘ Incorrect'}</b>${r.correct?'':' — answer: '+String.fromCharCode(65+r.correctIndex)}</div>`).join('')}</div>`:''}
        </div>`:'';

    const submittedText=sub&&sub.answerText
      ?`<div class="qbox"><b>Your submitted answers</b><div>${esc(sub.answerText)}</div></div>`:'';

    return `<div class="card" style="border-top:5px solid ${COL[0]}">
      <h3>${esc(a.title)} ${status}</h3>
      <p class="mut small">${esc(a.subject)} · ${esc(a.cls)} · ${kindLabel} · due ${fmtDate(a.due)} · ${a.marks} marks</p>
      ${a.desc?`<p>${esc(a.desc)}</p>`:''}
      ${a.kind==='cbt'?'':`<div style="margin:8px 0"><b>Task file(s):</b> ${fileBtns(a.files)} ${a.kind==='html'&&!ro&&(a.files||[]).some(f=>/\.html?$/i.test(f.name))&&!(sub&&sub.score!=null)?`<button class="btn sm ok" data-act="open-task" data-id="${a.id}">▶ Do it online</button>`:''}</div>`}
      ${graded}
      ${submittedText}
      ${work}
    </div>`;
  }).join('');
}

window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.sonline!==1||d.type!=='score')return;
  const fr=document.querySelector('iframe.frame');if(!fr||e.source!==fr.contentWindow)return;
  const u=me(),c=state.cur;if(!u||!c)return;
  const sc=Number(d.score),tt=Number(d.total);
  if(!isFinite(sc)||!isFinite(tt)||tt<=0||sc<0||sc>tt)return toast('The score could not be read. Finish the test first.',true);
  if(u.role!=='student')return toast('Preview only: this would send '+sc+'/'+tt+' for a student.');
  const all=subs();let rec,old,title;
  if(c.kind==='lesson'){
    const l=lessons().find(x=>x.id===c.id);if(!l)return;
    old=all.find(s=>s.aid==='les:'+l.id&&s.email===u.email);title=l.title;
    rec={id:old?old.id:uid(),aid:'les:'+l.id,email:u.email,name:u.fullname,cls:u.cls,kind:l.kind==='game'?'game':'lesson',title:l.title,score:sc,total:tt,details:d.details||'',attempts:(old&&old.attempts||0)+1,date:new Date().toISOString()};
  }else if(c.kind==='task'){
    const a=assignments().find(x=>x.id===c.aid);if(!a)return;
    old=all.find(s=>s.aid===a.id&&s.email===u.email);title=a.title;
    const scaled=Math.round(sc/tt*Number(a.marks)*100)/100;
    rec={id:old?old.id:uid(),aid:a.id,email:u.email,name:u.fullname,cls:u.cls,files:old&&old.files||[],kind:'html',answerText:'Auto-reported by the task: '+sc+' out of '+tt+'. '+(d.details||'').slice(0,300),score:scaled,feedback:'Auto-scored: '+sc+' of '+tt+'.',date:new Date().toISOString()};
  }else return;
  if(old)all[all.indexOf(old)]=rec;else all.push(rec);
  saveSubs(all);
  showModal('<h3>✅ Score sent to your teacher</h3><p class="big" style="font-size:2rem;margin:8px 0"><b>'+(c.kind==='task'?rec.score+'/'+(assignments().find(x=>x.id===c.aid)||{}).marks:sc+'/'+tt)+'</b></p><p class="mut">'+esc(title)+'. You can see it in My Results.</p><button class="btn" data-act="close-modal">OK</button>');
});

    if(kw)kw.classList.toggle('hidden',v!=='parent');
    if(code)code.classList.toggle('hidden',!(v==='teacher'||v==='admin'));
  },
  assignkind(el){
    const cbt=el.value==='cbt';
    const b=$('#cbtBuilder'),fw=$('#filesWrap');
    if(b)b.classList.toggle('hidden',!cbt);
    if(fw)fw.classList.toggle('hidden',cbt);
  },
  readhtml(el){
    const f=el.files&&el.files[0];if(!f)return;
    f.text().then(t=>{
      const ta=$('#lessonHtml');
      if(ta){ta.value=t;toast('File loaded into the editor.')}
    });
  },
  pickchild(el){state.child=el.value;render()},
  setcls(el){state.cls=el.value;render()},
  dircls(el){state.dirCls=el.value;render()}
};

const F={};

F.login=async f=>{
  const v=Object.fromEntries(new FormData(f));
  const email=String(v.email||'').trim().toLowerCase();
  const u=getUser(email);
  if(!u)return toast('Account not found. Please register first.',true);
  if(!(await pwOk(u,String(v.password||''))))return toast('Incorrect password.',true);
  if(!String(u.password).startsWith('h1:')){const hp=await pwHash(u.email,String(v.password));updateUser(u.email,x=>{x.password=hp})}
  LSset('session',{email:u.email});
  f.reset();
  state.tab=(TABS[u.role]||TABS.student)[0][0];
  state.page='dashboard';
  render();
  toast('Welcome back, '+u.fullname.split(' ')[0]+'!');
  window.scrollTo({top:0,behavior:'smooth'});
};

F.register=async f=>{
  const v=Object.fromEntries(new FormData(f));
  const email=String(v.email||'').trim().toLowerCase();
  const role=v.role;
  if(!v.fullname||!email||!v.phone)return toast('Please fill in every field.',true);
  if(String(v.password||'').length<6)return toast('Password must be at least 6 characters.',true);
  if(getUser(email))return toast('That email is already registered.',true);

  if(role==='admin')return toast('Admin accounts can only be created by the main admin.',true);
  if(role==='teacher'&&v.code!==cfg.teacherCode)return toast('Wrong teacher access code. Ask the admin.',true);
  if(role==='admin'){
    if(v.code!==cfg.adminCode)return toast('Wrong admin access code.',true);
    const admins=users().filter(x=>x.role==='admin');
    if(admins.length>=2)return toast('There can only be one main admin and one extra admin. No more admin accounts can be created.',true);
  }

  const all=users();
  let children=[];
  if(role==='parent'){
    const ce=String(v.childEmail||'').trim().toLowerCase();
    const child=all.find(x=>x.email===ce&&x.role==='student');
    if(!child)return toast('No student is registered with that email yet. Ask your child to register first.',true);
    children=[ce];
  }

  const rec={
    id:uid(),fullname:String(v.fullname).trim(),email,password:await pwHash(email,String(v.password)),
    role,cls:role==='student'?v.cls:'',
    studentId:role==='student'?nextStudentId():'',
    phone:String(v.phone).trim(),profile:null,children,
    created:new Date().toISOString()
  };
  all.push(rec);saveUsers(all);
  LSset('session',{email});
  state.tab=(TABS[role]||TABS.student)[0][0];
  state.page='dashboard';
  render();
  toast('Welcome to Sonline Classes! 🎉');
  window.scrollTo({top:0,behavior:'smooth'});
};

function nextStudentId(){
  let n=Number(LSget('seq',0))||0;
  const taken=users().map(u=>u.studentId).filter(Boolean);
  let id;
  do{n++;id='SON/'+new Date().getFullYear()+'/'+String(n).padStart(3,'0')}while(taken.includes(id));
  LSset('seq',n);
  return id;
}

F.contact=async f=>{
  const v=Object.fromEntries(new FormData(f));
  const rec={id:uid(),name:String(v.name||'').trim(),email:String(v.email||'').trim(),subject:String(v.subject||'').trim(),body:String(v.body||'').trim(),date:new Date().toISOString()};
  const btn=f.querySelector('[type=submit]');if(btn){btn.disabled=true;btn.textContent='Sending…'}
  // 1) always keep a copy on this device
  const m=messages();m.push(rec);saveMessages(m);
  // 2) email delivery through Formspree
  let mailed=false;
  const ep=String(cfg.formEndpoint||'').trim();
  if(/^https:\/\//.test(ep)){
    try{const r=await fetch(ep,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},
      body:JSON.stringify({name:rec.name,email:rec.email,_replyto:rec.email,_subject:'Sonline website: '+rec.subject,subject:rec.subject,message:rec.body})});mailed=r.ok}catch(e){}
  }
  // 3) cloud copy in Supabase (table: contact_messages)
  const saved=await sbInsert('contact_messages',{name:rec.name,email:rec.email,subject:rec.subject,message:rec.body});
  f.reset();if(btn){btn.disabled=false;btn.textContent='📨 Send message'}
  const to=cfg.email||'sonlineclasses01@gmail.com',wa=waNum();
  const txt='From: '+rec.name+' ('+rec.email+')\n\n'+rec.body;
  const waBtn=wa?`<a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('*'+rec.subject+'*\n'+txt)}">💬 Send on WhatsApp</a>`:'';
  const mailBtn=`<a class="btn" href="mailto:${esc(to)}?subject=${encodeURIComponent(rec.subject)}&body=${encodeURIComponent(txt)}">✉ Send by email</a>`;
  if(mailed){
    showModal(`<h3>✅ Message sent!</h3><p>Thank you, ${esc(rec.name)}. Your message has been delivered to Sonline Classes by email${saved?' and saved':''}. We will reply soon.</p>
      <p class="mut small">Want a faster reply? Message us on WhatsApp too:</p><p>${waBtn}</p>`);
  }else{
    showModal(`<h3>📨 One more tap to send</h3><p>Your message is saved. Tap a button to deliver it to Sonline Classes now:</p><p>${mailBtn} ${waBtn}</p>`);
  }
};

F.lesson=f=>{
  const u=me();
  const v=Object.fromEntries(new FormData(f));
  const html=String(v.html||'').trim();
  if(!String(v.title||'').trim())return toast('Give the lesson a title.',true);
  if(!html)return toast('Paste the HTML or choose a .html file.',true);
  if(html.length>600000)return toast('That lesson is too large (max 600 KB).',true);
  const list=lessons();
  list.push({id:uid(),kind:v.kind,title:String(v.title).trim(),subject:v.subject,cls:v.cls,
    desc:String(v.desc||'').trim(),html,teacherEmail:u.email,teacherName:u.fullname,

F.assignment=async f=>{
  const u=me();
  const v=Object.fromEntries(new FormData(f));
  const kind=v.kind||'cbt';
  let questions=[];

  if(kind==='cbt'){
    const cards=$$('.question-editor',f);
    questions=cards.map(c=>{
      const inputs=$$('input',c);
      const ta=c.querySelector('textarea');
      return {
        text:(ta?ta.value:'').trim(),
        options:inputs.slice(0,4).map(x=>x.value.trim()),
        answer:Number(c.querySelector('select')?.value||0)
      };
    });
    if(!questions.length||questions.some(q=>!q.text||q.options.some(o=>!o)))
      return toast('Fill in every question and all four options.',true);
  }

  let files=[];
  const fi=f.elements.files;
  if(fi&&fi.files&&fi.files.length){
    files=await saveFiles(fi.files);
    if(files===null)return;
  }
  if(kind==='html'&&!files.length)return toast('Attach the task file before publishing.',true);

  const list=assignments();
  list.push({
    id:uid(),category:f.dataset.category||'assignment',title:String(v.title||'').trim(),subject:v.subject,cls:v.cls,
    due:v.due,marks:Number(v.marks)||10,desc:String(v.desc||'').trim(),
    kind,questions,files,teacherEmail:u.email,teacherName:u.fullname,
    date:new Date().toISOString()
  });
  if(!await saveAssignments(list))return;
  toast('Assignment published to '+v.cls+'.');
  render();
};

F.resource=async f=>{
  const u=me();
  const v=Object.fromEntries(new FormData(f));
  const files=await saveFiles(f.elements.files.files);
  if(!files||!files.length)return;
  const list=resources();
  list.push({id:uid(),title:String(v.title||'').trim(),subject:v.subject,cls:v.cls,
    desc:String(v.desc||'').trim(),files,teacherEmail:u.email,teacherName:u.fullname,
    date:new Date().toISOString()});
  saveResources(list);
  toast('Resource uploaded.');
  render();
};

F['submit-cbt']=f=>{
  const u=me();
  const aid=f.dataset.aid;
  const a=assignments().find(x=>x.id===aid);
  if(!a||a.kind!=='cbt')return toast('This assessment is no longer available.',true);
  const fd=new FormData(f);
  const qs=a.questions||[];
  let correct=0;
  const responses=qs.map((q,i)=>{
    const sel=Number(fd.get('q_'+i));
    const ok=sel===Number(q.answer);
    if(ok)correct++;
    return {selectedIndex:sel,correctIndex:Number(q.answer),correct:ok};
  });
  const score=qs.length?Math.round(correct/qs.length*Number(a.marks)*100)/100:0;
  const all=subs();
  const old=all.find(s=>s.aid===aid&&s.email===u.email);
  const rec={id:old?old.id:uid(),aid,email:u.email,name:String(fd.get('studentName')||u.fullname).trim(),
    cls:u.cls,kind:'cbt',responses,score,feedback:'Automatically marked: '+correct+' of '+qs.length+' correct.',
    date:new Date().toISOString()};
  if(old)all[all.indexOf(old)]=rec;else all.push(rec);
  saveSubs(all);
  toast('Submitted! Your score: '+score+'/'+a.marks);
  render();
};

F['submit-theory']=async f=>{

F['grade-sub']=f=>{
  const all=subs();
  const s=all.find(x=>x.id===f.dataset.sid);
  if(!s)return;
  const max=Number(f.dataset.max)||100;
  const sc=Number(f.elements.score.value);
  if(isNaN(sc)||sc<0||sc>max)return toast('Score must be between 0 and '+max+'.',true);
  s.score=sc;
  s.feedback=f.elements.feedback.value.trim();
  saveSubs(all);
  toast('Score saved.');
  render();
};

F.grade=async f=>{
  const v=Object.fromEntries(new FormData(f));
  const sc=Number(v.score);
  if(isNaN(sc)||sc<0||sc>100)return toast('Score must be between 0 and 100.',true);
  const g=grades();
  const old=g.find(x=>x.email===v.email&&x.subject===v.subject);
  if(old)old.score=sc;
  else g.push({id:uid(),email:v.email,subject:v.subject,score:sc,date:new Date().toISOString()});
  if(!await saveGrades(g))return;
  toast('Result saved.');
  render();
};

F.profile=async f=>{
  const u=me();
  const v=Object.fromEntries(new FormData(f));
  let photo=(u.profile&&u.profile.photo)||null;
  const pf=f.elements.photo.files[0];
  if(pf){
    const m=await saveFiles([pf],true);
    if(!m)return;
    if(photo)delFiles([photo]);
    photo=m[0];
  }
  let sid=u.studentId||nextStudentId();
  updateUser(u.email,x=>{
    x.fullname=String(v.fullname||'').trim();
    x.cls=v.cls;
    x.studentId=sid;
    x.profile={
      dob:v.dob,gender:v.gender,country:v.country,state:v.state,
      guardianName:v.guardianName,guardianPhone:v.guardianPhone,guardianEmail:v.guardianEmail,
      address:v.address,goal:v.goal,photo,submittedAt:new Date().toISOString()
    };
  });
  state.edit=false;
  toast('Profile saved.');
  render();
};

F['link-child']=f=>{
  const v=Object.fromEntries(new FormData(f));
  const email=String(v.email||'').trim().toLowerCase();
  const sid=String(v.sid||'').trim();
  const s=getUser(email);
  if(!s||s.role!=='student')return toast('No student found with that email.',true);
  if(!s.studentId)return toast('That student has not completed their profile yet.',true);
  if(s.studentId.toLowerCase()!==sid.toLowerCase())return toast('Student ID does not match.',true);
  const u=me();
  if((u.children||[]).includes(email))return toast('Already linked.',true);
  updateUser(u.email,x=>{x.children=(x.children||[]).concat(email)});
  state.child=email;
  toast(s.fullname+' linked.');
  render();
};

F.codes=f=>{
  const u=me();
  if(!isMainAdmin(u))return toast('Only the main admin can change access codes.',true);
  const v=Object.fromEntries(new FormData(f));
  if(!String(v.teacherCode||'').trim()||!String(v.adminCode||'').trim())
    return toast('Both codes are required.',true);
  cfg.teacherCode=String(v.teacherCode).trim();
  cfg.adminCode=String(v.adminCode).trim();
  cfg.formEndpoint=String(v.formEndpoint||'').trim()||DEF.formEndpoint;

  cfg.supabaseUrl=DEF.supabaseUrl;cfg.supabaseKey=DEF.supabaseKey;
  saveCfg();
  toast('Settings updated.');
  render();
  sbBoot();
};

document.addEventListener('submit',e=>{
  const f=e.target;
  const h=F[f.dataset.form];
  if(h){
    e.preventDefault();
    try{
      const r=h(f);
      if(r&&r.catch)r.catch(err=>{console.error(err);toast('Something went wrong. Please try again.',true)});
    }catch(err){console.error(err);toast('Something went wrong. Please try again.',true)}
  }
});
